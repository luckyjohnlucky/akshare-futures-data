name: Collect commodity futures data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pvc-collect-nine
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check target branch
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "release/pvc-nine-contracts" ]; then
            echo "ERROR: This workflow must run on release/pvc-nine-contracts branch. Current: ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE})"
            exit 1
          fi
      - name: Fetch latest data (minute + daily, independent)
        run: python fetch_pvc.py

      - name: Commit all data changes
        run: |
          # Build list of existing CSV files to add
          set -e
          FILES=""
          for symbol in V0 TA0 MA0 PP0 L0 SA0 FG0 RB0 HC0; do
            if [ -f "output/${symbol}_minute_bars.csv" ]; then
              FILES+=" output/${symbol}_minute_bars.csv"
            fi
            if [ -f "output/${symbol}_daily_bars.csv" ]; then
              FILES+=" output/${symbol}_daily_bars.csv"
            fi
          done
          
          if [ -z "$FILES" ]; then
            echo "No CSV files found to add."
          else
            git add $FILES
            if git diff --quiet --cached; then
              echo "No data changes; nothing to commit."
            else
              git commit -m "chore: auto-collect commodity futures data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            fi
          fi
