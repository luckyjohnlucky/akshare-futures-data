name: Collect PVC futures data

on:
  workflow_dispatch:
  schedule:
    # Day session morning: Beijing 09:00–11:40 (UTC 01:00–03:40), Mon-Fri
    - cron: '*/5 1-2 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40 3 * * 1-5'
    # Day session afternoon: Beijing 13:30–15:10 (UTC 05:30–07:10), Mon-Fri
    - cron: '30,35,40,45,50,55 5 * * 1-5'
    - cron: '*/5 6 * * 1-5'
    - cron: '0,5,10 7 * * 1-5'
    # Night session: Beijing 21:00–23:10 (UTC 13:00–15:10), Mon-Fri (UTC Sun-Thu)
    - cron: '*/5 13-14 * * 0-4'
    - cron: '0,5,10 15 * * 0-4'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest data (minute + daily + realtime, independent)
        run: python fetch_pvc.py

      - name: Commit minute data changes
        run: |
          git add output/minute_bars.json output/minute_bars.csv \
                 output/minute_data_quality.jsonl
          if git diff --quiet --cached \
             -- output/minute_bars.json output/minute_bars.csv output/minute_data_quality.jsonl; then
            echo "No minute data changes; nothing to commit."
          else
            git commit -m "chore: auto-refresh PVC minute data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Commit daily data changes
        run: |
          git add output/daily_bars.json output/daily_bars.csv
          if git diff --quiet --cached -- output/daily_bars.json output/daily_bars.csv; then
            echo "No daily data changes; nothing to commit."
          else
            git commit -m "chore: auto-refresh PVC daily data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Commit realtime snapshot changes
        run: |
          git add output/realtime_snapshots.jsonl
          if git diff --quiet --cached -- output/realtime_snapshots.jsonl; then
            echo "No realtime snapshot changes; nothing to commit."
          else
            git commit -m "chore: auto-collect PVC realtime snapshot ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
