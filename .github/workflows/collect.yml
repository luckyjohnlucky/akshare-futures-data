name: Collect PVC futures data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pvc-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest data (minute + daily + realtime, independent)
        run: python fetch_pvc.py

      - name: Commit all data changes
        run: |
          git add output/minute_bars.json output/minute_bars.csv \
                 output/minute_data_quality.jsonl \
                 output/daily_bars.json output/daily_bars.csv \
                 output/realtime_snapshots.jsonl
          if git diff --quiet --cached; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "chore: auto-collect PVC data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            for i in 1 2 3; do
              git fetch origin
              git rebase origin/main
              if git push; then
                break
              fi
              echo "Push failed, retrying ($i/3)..."
              sleep 5
            done
          fi
